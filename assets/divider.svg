<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.25" stop-color="#8A2BE2"/>
      <stop offset="0.5" stop-color="#FF4D9D"/>
      <stop offset="0.75" stop-color="#F7B731"/>
      <stop offset="1" stop-color="#36BCF7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-900 0" to="0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- flowing gradient line -->
  <rect x="0" y="5" width="900" height="4" rx="2" fill="url(#flow)"/>

  <!-- glowing dot travelling along the line -->
  <circle cy="7" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" from="-10" to="910" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="7" r="3" fill="#36BCF7" filter="url(#glow)">
    <animate attributeName="cx" from="910" to="-10" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
